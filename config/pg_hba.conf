# ==============================================================================
# OENEXA PostgreSQL 17 Client Authentication Configuration (pg_hba.conf)
# Strict Host-Based Security: Mandatory SCRAM-SHA-256 Password Authentication
# ==============================================================================

# TYPE  DATABASE        USER            ADDRESS                 METHOD

# Local unix socket connections (inside container)
local   all             postgres                                peer
local   all             all                                     scram-sha-256

# IPv4 local loopback connections
host    all             all             127.0.0.1/32            scram-sha-256

# IPv6 local loopback connections (Docker localhost resolves to ::1)
host    all             all             ::1/128                 scram-sha-256

# Private internal Docker networks & host connections
host    all             all             all                     scram-sha-256
