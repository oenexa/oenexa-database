# ==============================================================================
# OENEXA PostgreSQL 17 Client Authentication Configuration (pg_hba.conf)
# Strict Host-Based Security: Mandatory SCRAM-SHA-256 Encryption
# ==============================================================================

# TYPE  DATABASE        USER            ADDRESS                 METHOD

# Local socket connections (inside container)
local   all             postgres                                peer
local   all             all                                     scram-sha-256

# IPv4 local loopback connections
host    all             all             127.0.0.1/32            scram-sha-256

# Private internal Docker networks (e.g. 172.16.0.0/12, 10.0.0.0/8)
host    all             all             10.0.0.0/8              scram-sha-256
host    all             all             172.16.0.0/12           scram-sha-256
host    all             all             192.168.0.0/16          scram-sha-256

# Disallow direct public connections (all traffic must route through private net)
host    all             all             0.0.0.0/0               reject
