# ==============================================================================
# OENEXA Enterprise PgBouncer Connection Pooler Configuration
# Multiplexes Connections Across All 9 Enterprise Domain Databases
# ==============================================================================

[databases]
oenexa_identity_db = host=oenexa-postgres port=5432 dbname=oenexa_identity_db
oenexa_wallet_db = host=oenexa-postgres port=5432 dbname=oenexa_wallet_db
oenexa_pay_db = host=oenexa-postgres port=5432 dbname=oenexa_pay_db
oenexa_exchange_db = host=oenexa-postgres port=5432 dbname=oenexa_exchange_db
oenexa_liquidity_db = host=oenexa-postgres port=5432 dbname=oenexa_liquidity_db
oenexa_ai_db = host=oenexa-postgres port=5432 dbname=oenexa_ai_db
oenexa_market_data_db = host=oenexa-postgres port=5432 dbname=oenexa_market_data_db
oenexa_validator_db = host=oenexa-postgres port=5432 dbname=oenexa_validator_db
oengo_commerce_db = host=oenexa-postgres port=5432 dbname=oengo_commerce_db

[pgbouncer]
logfile = /var/log/pgbouncer/pgbouncer.log
pidfile = /var/run/pgbouncer/pgbouncer.pid

listen_addr = *
listen_port = 6432
auth_type = scram-sha-256
auth_file = /etc/pgbouncer/userlist.txt

# Transaction pooling mode
pool_mode = transaction
max_client_conn = 1500
default_pool_size = 20
min_pool_size = 5
reserve_pool_size = 5
reserve_pool_timeout = 5
max_db_connections = 200

# Timeouts & keepalives
server_idle_timeout = 600
client_idle_timeout = 60
query_timeout = 30
server_connect_timeout = 15
server_login_retry = 15
client_login_timeout = 60
