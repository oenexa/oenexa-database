# ==============================================================================
# OENEXA Enterprise Redis 7 Configuration
# Ultra-Low Latency Caching, Pub/Sub, and Token Rate Limiting
# ==============================================================================

# Network
bind 0.0.0.0
port 6379
tcp-backlog 511
timeout 0
tcp-keepalive 300

# Memory Management (Defense against OOM)
maxmemory 2gb
maxmemory-policy allkeys-lru

# Persistence (AOF for durability + RDB snapshots)
save 900 1
save 300 10
save 60 10000
stop-writes-on-bgsave-error yes
rdbcompression yes
rdbchecksum yes
dbfilename dump.rdb
dir /data

appendonly yes
appendfilename "appendonly.aof"
appendfsync everysec
no-appendfsync-on-rewrite no
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb

# Security
protected-mode no
# requirepass set via environment variable
