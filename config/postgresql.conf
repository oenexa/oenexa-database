# ==============================================================================
# OENEXA Enterprise PostgreSQL 17 Performance Configuration
# Tuned for Multi-Domain AI, FinTech ACID, and Low-Latency OLTP
# ==============================================================================

# -----------------------------
# Connectivity & Authentication
# -----------------------------
listen_addresses = '*'
port = 5432
max_connections = 200
password_encryption = scram-sha-256
ssl = off # Terminated at wireguard/private network or SSL reverse proxy

# -----------------------------
# Memory & Worker Sizing
# Baseline: 16GB-32GB Host RAM
# -----------------------------
shared_buffers = 4GB                  # 25% of total system RAM
effective_cache_size = 12GB           # 75% of total system RAM
maintenance_work_mem = 1GB            # For fast index generation & VACUUM
work_mem = 16MB                       # Per-query sort/hash memory
huge_pages = try
effective_io_concurrency = 200        # NVMe SSD storage concurrency

# -----------------------------
# Background Writer & Checkpoints
# -----------------------------
checkpoint_completion_target = 0.9    # Smooth out disk I/O spikes
checkpoint_timeout = 15min
max_wal_size = 16GB
min_wal_size = 2GB
wal_buffers = 16MB
wal_compression = on

# -----------------------------
# Write-Ahead Logging & Replication
# -----------------------------
wal_level = replica
archive_mode = on
archive_command = '/bin/true'         # Replaced by pgBackRest / rsync in production
max_wal_senders = 5

# -----------------------------
# Query Optimization
# -----------------------------
random_page_cost = 1.1                # Fast NVMe SSD read cost
seq_page_cost = 1.0
default_statistics_target = 100

# -----------------------------
# Query Profiling & Observability
# -----------------------------
shared_preload_libraries = 'pg_stat_statements'
pg_stat_statements.max = 10000
pg_stat_statements.track = all
track_activities = on
track_counts = on
track_io_timing = on
log_min_duration_statement = 250      # Log queries exceeding 250ms (slow query audit)
log_checkpoints = on
log_connections = off
log_disconnections = off
log_lock_waits = on
log_temp_files = 0
