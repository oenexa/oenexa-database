# ==============================================================================
# OENEXA Enterprise Database Platform — Dedicated Production Server Stack
# Engineered for High-Throughput NVMe Hosts with Connection Pooling
# ==============================================================================
services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: oenexa-postgres
    restart: unless-stopped
    ports:
      # Bound to internal loopback / private VPN interface only
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      IDENTITY_DB_NAME: ${IDENTITY_DB_NAME}
      IDENTITY_DB_USER: ${IDENTITY_DB_USER}
      IDENTITY_DB_PASSWORD: ${IDENTITY_DB_PASSWORD}
      WALLET_DB_NAME: ${WALLET_DB_NAME}
      WALLET_DB_USER: ${WALLET_DB_USER}
      WALLET_DB_PASSWORD: ${WALLET_DB_PASSWORD}
      PAY_DB_NAME: ${PAY_DB_NAME}
      PAY_DB_USER: ${PAY_DB_USER}
      PAY_DB_PASSWORD: ${PAY_DB_PASSWORD}
      EXCHANGE_DB_NAME: ${EXCHANGE_DB_NAME}
      EXCHANGE_DB_USER: ${EXCHANGE_DB_USER}
      EXCHANGE_DB_PASSWORD: ${EXCHANGE_DB_PASSWORD}
      LIQUIDITY_DB_NAME: ${LIQUIDITY_DB_NAME}
      LIQUIDITY_DB_USER: ${LIQUIDITY_DB_USER}
      LIQUIDITY_DB_PASSWORD: ${LIQUIDITY_DB_PASSWORD}
      AI_DB_NAME: ${AI_DB_NAME}
      AI_DB_USER: ${AI_DB_USER}
      AI_DB_PASSWORD: ${AI_DB_PASSWORD}
      MARKET_DATA_DB_NAME: ${MARKET_DATA_DB_NAME}
      MARKET_DATA_DB_USER: ${MARKET_DATA_DB_USER}
      MARKET_DATA_DB_PASSWORD: ${MARKET_DATA_DB_PASSWORD}
      VALIDATOR_DB_NAME: ${VALIDATOR_DB_NAME}
      VALIDATOR_DB_USER: ${VALIDATOR_DB_USER}
      VALIDATOR_DB_PASSWORD: ${VALIDATOR_DB_PASSWORD}
      COMMERCE_DB_NAME: ${COMMERCE_DB_NAME}
      COMMERCE_DB_USER: ${COMMERCE_DB_USER}
      COMMERCE_DB_PASSWORD: ${COMMERCE_DB_PASSWORD}
    volumes:
      - /opt/oenexa/data/postgres:/var/lib/postgresql/data
      - ./init:/docker-entrypoint-initdb.d:ro
      - ./schemas:/schemas:ro
      - ./config/postgresql.conf:/etc/postgresql/postgresql.conf:ro
      - ./config/pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
    command: postgres -c config_file=/etc/postgresql/postgresql.conf -c hba_file=/etc/postgresql/pg_hba.conf
    deploy:
      resources:
        limits:
          memory: 16G
        reservations:
          memory: 4G
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - oenexa-net

  pgbouncer:
    image: edoburu/pgbouncer:latest
    container_name: oenexa-pgbouncer
    restart: unless-stopped
    ports:
      - "127.0.0.1:6432:6432"
    volumes:
      - ./config/pgbouncer.ini:/etc/pgbouncer/pgbouncer.ini:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - oenexa-net

  redis:
    image: redis:7-alpine
    container_name: oenexa-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    command: redis-server /usr/local/etc/redis/redis.conf --requirepass ${REDIS_PASSWORD}
    volumes:
      - /opt/oenexa/data/redis:/data
      - ./config/redis.conf:/usr/local/etc/redis/redis.conf:ro
    deploy:
      resources:
        limits:
          memory: 4G
        reservations:
          memory: 1G
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - oenexa-net

networks:
  oenexa-net:
    name: oenexa-net
    external: true
